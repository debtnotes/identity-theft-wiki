site_name: Identity Fraud Knowledge Base
site_description: Evidence-first public guidance for identity-fraud response and research.
site_url: https://debtnotes.github.io/identity-theft-wiki/
repo_url: https://github.com/debtnotes/identity-theft
repo_name: debtnotes/identity-theft
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: teal
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Start here:
      - Immediate steps: guides/immediate-steps.md
      - Credit freezes and fraud alerts: guides/freezes-and-alerts.md
      - Debt collectors: guides/debt-collectors.md
  - Research:
      - What this project covers: research/scope-and-method.md
      - Sources and evidence standard: research/sources.md
      - Paid-product research status: research/paid-products.md
